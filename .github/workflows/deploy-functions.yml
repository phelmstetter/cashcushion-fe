name: Deploy Cloud Functions

# Triggers on every push to the main branch.
on:
  push:
    branches:
      - main

jobs:
  deploy-functions:
    name: Deploy Firebase Cloud Functions (Gen 2)
    runs-on: ubuntu-latest

    # Required for google-github-actions/auth to request a short-lived token
    # when using Workload Identity Federation (not needed for service-account
    # key auth, but harmless to include and good practice).
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: functions/package-lock.json

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      # Install function dependencies so the Firebase CLI can validate and
      # package the source before uploading to Cloud Build.
      - name: Install function dependencies
        working-directory: functions
        run: npm ci

      # Authenticate to GCP using the official google-github-actions/auth action.
      # This is more portable and robust than shelling out to gcloud directly.
      #
      # Required GitHub Actions secrets — add these in your repository under
      # Settings → Secrets and variables → Actions → New repository secret:
      #
      #   FIREBASE_SERVICE_ACCOUNT
      #     The full JSON content of a GCP service account key that has the
      #     following IAM roles on the project:
      #       - Firebase Admin           (roles/firebase.admin)
      #       - Cloud Functions Admin    (roles/cloudfunctions.admin)
      #       - Service Account User     (roles/iam.serviceAccountUser)
      #     Generate this key in the Google Cloud Console:
      #       IAM & Admin → Service Accounts → your service account → Keys → Add Key → JSON
      #     Copy the entire contents of the downloaded .json file as the secret value.
      #
      #   FIREBASE_PROJECT_ID
      #     The Firebase/GCP project ID — must match the "default" value in .firebaserc.
      #     Example value: cashcushion
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Deploy Cloud Functions
        run: firebase deploy --only functions --project ${{ secrets.FIREBASE_PROJECT_ID }} --non-interactive
