substitutions:
  _REGION: us-central1
  _SERVICE: cashcushion-web
  _REPO: cashcushion
  _VITE_API_KEY: ''
  _VITE_APP_ID: ''
  _VITE_AUTH_DOMAIN: ''
  _VITE_MESSAGING_SENDER_ID: ''
  _VITE_PROJECT_ID: ''
  _VITE_STORAGE_BUCKET: ''
  _VITE_FUNCTIONS_URL: ''
  _VITE_RECAPTCHA_SITE_KEY: ''

steps:
  # 1. Install dependencies on the Cloud Build worker.
  - id: install
    name: node:20
    entrypoint: npm
    args: [ci]

  # 2. Build the Vite frontend — output lands at dist/public on the worker.
  #    VITE_* vars are baked into the bundle here.
  - id: vite-build
    name: node:20
    entrypoint: npx
    args: [vite, build]
    env:
      - NODE_ENV=production
      - VITE_API_KEY=$_VITE_API_KEY
      - VITE_APP_ID=$_VITE_APP_ID
      - VITE_AUTH_DOMAIN=$_VITE_AUTH_DOMAIN
      - VITE_MESSAGING_SENDER_ID=$_VITE_MESSAGING_SENDER_ID
      - VITE_PROJECT_ID=$_VITE_PROJECT_ID
      - VITE_STORAGE_BUCKET=$_VITE_STORAGE_BUCKET
      - VITE_FUNCTIONS_URL=$_VITE_FUNCTIONS_URL
      - VITE_RECAPTCHA_SITE_KEY=$_VITE_RECAPTCHA_SITE_KEY
    waitFor: [install]

  # 3a. Deploy dist/public to Firebase Hosting.
  #     Runs in parallel with the Docker build (both wait only for vite-build).
  #     Requires the Cloud Build service account to have the
  #     Firebase Hosting Admin role (roles/firebasehosting.admin).
  - id: firebase-hosting
    name: node:20
    entrypoint: sh
    args:
      - -c
      - |
        npm install -g firebase-tools
        firebase deploy --only hosting --project $PROJECT_ID
    waitFor: [vite-build]

  # 3b. Build the Docker image using the pre-built dist/public.
  #     Runs in parallel with firebase-hosting.
  - id: docker-build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --tag=us-central1-docker.pkg.dev/$PROJECT_ID/$_REPO/web:$COMMIT_SHA
      - --tag=us-central1-docker.pkg.dev/$PROJECT_ID/$_REPO/web:latest
      - .
    waitFor: [vite-build]

  # 4. Push the image to Artifact Registry.
  - id: docker-push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - us-central1-docker.pkg.dev/$PROJECT_ID/$_REPO/web
    waitFor: [docker-build]

  # 5. Deploy the new image to Cloud Run.
  - id: cloud-run-deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - $_SERVICE
      - --image=us-central1-docker.pkg.dev/$PROJECT_ID/$_REPO/web:$COMMIT_SHA
      - --region=$_REGION
      - --platform=managed
      - --no-allow-unauthenticated
      - --ingress=internal-and-cloud-load-balancing
      - --port=8080
    waitFor: [docker-push]

images:
  - us-central1-docker.pkg.dev/$PROJECT_ID/$_REPO/web:$COMMIT_SHA
  - us-central1-docker.pkg.dev/$PROJECT_ID/$_REPO/web:latest

options:
  logging: CLOUD_LOGGING_ONLY
