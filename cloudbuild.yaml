substitutions:
  _REGION: us-central1
  _SERVICE: cashcushion-web
  _REPO: cashcushion
  _VITE_API_KEY: ''
  _VITE_APP_ID: ''
  _VITE_AUTH_DOMAIN: ''
  _VITE_MESSAGING_SENDER_ID: ''
  _VITE_PROJECT_ID: ''
  _VITE_STORAGE_BUCKET: ''
  _VITE_FUNCTIONS_URL: ''

steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --tag=us-central1-docker.pkg.dev/$PROJECT_ID/$_REPO/web:$COMMIT_SHA
      - --tag=us-central1-docker.pkg.dev/$PROJECT_ID/$_REPO/web:latest
      - --build-arg=VITE_API_KEY=$_VITE_API_KEY
      - --build-arg=VITE_APP_ID=$_VITE_APP_ID
      - --build-arg=VITE_AUTH_DOMAIN=$_VITE_AUTH_DOMAIN
      - --build-arg=VITE_MESSAGING_SENDER_ID=$_VITE_MESSAGING_SENDER_ID
      - --build-arg=VITE_PROJECT_ID=$_VITE_PROJECT_ID
      - --build-arg=VITE_STORAGE_BUCKET=$_VITE_STORAGE_BUCKET
      - --build-arg=VITE_FUNCTIONS_URL=$_VITE_FUNCTIONS_URL
      - .

  - id: push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - us-central1-docker.pkg.dev/$PROJECT_ID/$_REPO/web

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - $_SERVICE
      - --image=us-central1-docker.pkg.dev/$PROJECT_ID/$_REPO/web:$COMMIT_SHA
      - --region=$_REGION
      - --platform=managed
      - --no-allow-unauthenticated
      - --ingress=internal-and-cloud-load-balancing
      - --port=8080

images:
  - us-central1-docker.pkg.dev/$PROJECT_ID/$_REPO/web:$COMMIT_SHA
  - us-central1-docker.pkg.dev/$PROJECT_ID/$_REPO/web:latest

options:
  logging: CLOUD_LOGGING_ONLY
