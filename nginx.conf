server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # Block requests arriving directly via the raw Cloud Run URL (*.run.app).
    # This is a defense-in-depth layer; the primary control is
    # --no-allow-unauthenticated + --ingress=internal-and-cloud-load-balancing
    # in cloudbuild.yaml.
    # Firebase Hosting domains (*.web.app, *.firebaseapp.com) and any
    # custom domain pass through; only *.run.app is rejected.
    if ($http_host ~* "\.run\.app$") {
        return 403;
    }

    # Never cache the SPA entry point
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Cache hashed static assets for one year
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # SPA fallback — all unmatched routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
