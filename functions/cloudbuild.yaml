steps:
  # 1. Install dependencies — versions are pinned exactly in package.json (no ^ ranges),
  #    so npm install is reproducible without needing a committed package-lock.json.
  - name: 'node:22'
    id: 'Install'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "Cleaning old modules..."
        rm -rf node_modules
        echo "Installing dependencies..."
        npm install
    dir: 'functions'

  # 2. Deploy Gen2 gateway function to Cloud Functions
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'Deploy'
    entrypoint: 'gcloud'
    args:
      - 'functions'
      - 'deploy'
      - 'gateway'
      - '--gen2'
      - '--region=us-central1'
      - '--runtime=nodejs20'
      - '--source=.'
      - '--entry-point=gateway'
      - '--trigger-http'
      - '--allow-unauthenticated'
      - '--set-secrets=PLAID_SECRETS=plaid_secrets:latest'
      - '--project=cashcushion'
    dir: 'functions'
    waitFor: ['Install']

timeout: '1600s'
