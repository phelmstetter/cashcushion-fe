substitutions:
  # Set this in the Cloud Build trigger. The leading underscore is required
  # for user-defined Cloud Build substitutions; the deployed runtime variable
  # intentionally does not include it.
  _PLAID_ALLOWED_REDIRECT_URIS: ''

steps:
  # 1. Install the committed dependency graph reproducibly.
  - name: 'node:22'
    id: 'Install'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "Cleaning old modules..."
        rm -rf node_modules
        echo "Installing dependencies..."
        npm ci
    dir: 'functions'

  # 2. Audit production dependencies. npm audit still reports lower-severity
  #    findings for review, but exits non-zero for high or critical findings.
  - name: 'node:22'
    id: 'Audit'
    entrypoint: 'npm'
    args: ['audit', '--omit=dev', '--audit-level=high']
    dir: 'functions'
    waitFor: ['Install']

  # 3. Deploy Gen2 gateway function to Cloud Functions
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'Deploy'
    entrypoint: 'gcloud'
    args:
      - 'functions'
      - 'deploy'
      - 'gateway'
      - '--gen2'
      - '--region=us-central1'
      - '--runtime=nodejs22'
      - '--source=.'
      - '--entry-point=gateway'
      - '--trigger-http'
      - '--allow-unauthenticated'
      - '--set-secrets=PLAID_SECRETS=plaid_secrets:latest'
      - '--update-env-vars=^@^PLAID_ALLOWED_REDIRECT_URIS=$_PLAID_ALLOWED_REDIRECT_URIS'
      - '--project=cashcushion'
    dir: 'functions'
    waitFor: ['Audit']

timeout: '1600s'
